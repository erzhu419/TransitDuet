experiments:
  current_longtrain_ep200_wu10:
    status: complete_predriftcost
    episodes: 200
    last_k: 100
    upper_warmup_eps: 10
    seeds: paired_seeds_20
    config_set: predriftcost_longtrain_4x6
    runner: scripts/run_freqduet_paper_longtrain_matrix.sh
    logs_dir: logs_paper_longtrain_current_ep200_wu10
    result_dir: results_freqduet/paper_longtrain_current_ep200_wu10
    per_seed_csv: results_freqduet/paper_longtrain_current_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
    summary_csv: results_freqduet/paper_longtrain_current_ep200_wu10/combined_summary/freqduet_ablation_summary.csv
    paper_summary_command: >
      python3 scripts/summarize_freqduet_paper_matrix.py
      --per-seed results_freqduet/paper_longtrain_current_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
      --out-dir results_freqduet/paper_longtrain_current_ep200_wu10/paper_summary

  driftcost_longtrain_candidate_ep200_wu10:
    status: complete_promoted_to_main
    episodes: 200
    last_k: 100
    upper_warmup_eps: 10
    seeds: paired_seeds_20
    config_set: driftcost_candidate_4x1
    runner: scripts/run_freqduet_ablation.py
    logs_dir: logs_driftcost_longtrain_ep200_wu10
    result_dir: results_freqduet/driftcost_longtrain_ep200_wu10
    per_seed_csv: results_freqduet/driftcost_longtrain_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
    candidate_comparison_dir: results_freqduet/driftcost_longtrain_ep200_wu10/candidate_comparison
    promoted_aliases:
      - F_freqduet_terminal_main_hiro
      - F_freqduet_gen_highnoise_main_hiro
      - F_freqduet_gen_odshift_main_hiro
      - F_freqduet_gen_rushshift_main_hiro
    comparison_command: >
      python3 scripts/compare_freqduet_candidate.py
      --baseline-per-seed results_freqduet/paper_longtrain_current_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
      --candidate-per-seed results_freqduet/driftcost_longtrain_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
      --candidate-method main_driftcost
      --out-dir results_freqduet/driftcost_longtrain_ep200_wu10/candidate_comparison

  promoted_longtrain_ep200_wu10:
    status: complete_from_validated_candidate_relabel
    episodes: 200
    last_k: 100
    upper_warmup_eps: 10
    seeds: paired_seeds_20
    config_set: current_longtrain_4x6
    builder: scripts/build_freqduet_promoted_matrix.py
    result_dir: results_freqduet/paper_longtrain_promoted_ep200_wu10
    per_seed_csv: results_freqduet/paper_longtrain_promoted_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
    summary_csv: results_freqduet/paper_longtrain_promoted_ep200_wu10/combined_summary/freqduet_ablation_summary.csv
    paper_summary_dir: results_freqduet/paper_longtrain_promoted_ep200_wu10/paper_summary
    build_command: >
      python3 scripts/build_freqduet_promoted_matrix.py
      --baseline-per-seed results_freqduet/paper_longtrain_current_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
      --candidate-per-seed results_freqduet/driftcost_longtrain_ep200_wu10/combined_summary/freqduet_ablation_per_seed.csv
      --out-dir results_freqduet/paper_longtrain_promoted_ep200_wu10/combined_summary

  heldout_generalization_ep100_wu10:
    status: complete_promoted_current
    episodes: 100
