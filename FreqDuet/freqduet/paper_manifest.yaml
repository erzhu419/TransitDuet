data_sources:
  external_afc_apc_profile_v1:
    status: copied_public_profile_cache_data_only
    purpose: public AFC/APC demand-profile evidence for FreqDuet realism audit
    files:
      - data/external_afc_apc/README.md
      - data/external_afc_apc/public_afc_mta/hourly_ridership.csv
      - data/external_afc_apc/public_apc_halifax/route_boardings.csv
    boundary: >
      Data-only reuse of public AFC/APC cache files. The separate transit_hrl
      algorithm implementation, checkpoints, and result claims are not imported
      into FreqDuet.

  external_od_onboard_truth_v1:
    status: copied_public_mta_sample_and_external_mbta_source_pointer
    purpose: public agency OD-estimate and onboard-load truth-source audit for FreqDuet realism evidence
    files:
      - data/external_truth_sources/README.md
      - data/external_truth_sources/mta_subway_od/mta_subway_od_2024_sample_5000.json
      - data/external_truth_sources/mta_subway_od/mta_subway_od_2024_count.json
      - data/external_truth_sources/mta_subway_od/mta_subway_od_2024_metadata.json
    boundary: >
      MTA OD sample and metadata are copied into FreqDuet. The MBTA bus
      stop/trip board-alight-load raw CSV is large and remains an external
      local cache; FreqDuet packages only derived calibration-target tables.

  mta_bus_time_api_offline_cache_v1:
    status: downloaded_offline_mta_api_cache_freqduet_only
    purpose: offline MTA Bus Time API route/stop/vehicle snapshot cache for FreqDuet external-data audits
    files:
      - data/external_truth_sources/mta_bus_time_api/README.md
      - data/external_truth_sources/mta_bus_time_api/.gitignore
      - data/external_truth_sources/mta_bus_time_api/offline_cache/latest_manifest.json
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/manifest.json
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_agencies.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_routes.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_stops.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_route_stop_sequences.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_vehicle_snapshot_meta.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_vehicle_snapshots.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_source_coverage.csv
      - data/external_truth_sources/mta_bus_time_api/offline_cache/20260626T144132Z/parsed/mta_bus_time_claim_boundaries.csv
    boundary: >
      FreqDuet-only offline MTA Bus Time API route/stop/vehicle snapshot cache.
      This is not MTA APC/onboard-load data, not a full-day historical AVL
      archive, not a field deployment result, and not FreqHRL paper result data.

  mbta_same_network_calibration_v1:
    status: local_public_source_pointer_and_generated_audit
    purpose: same-agency MBTA APC-to-GTFS route/stop structural calibration evidence
    files:
      - data/external_truth_sources/mbta_same_network/README.md
    boundary: >
      Supports same-agency APC board/alight/load to static GTFS route/stop
      matching and Route 111 calibration targets. Does not support same-day
      AFC/APC/AVL/OD control-loop calibration or field deployment outcomes.

