_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_spline2dir_promreplan_hiro

# Exp39-style repair at the upper layer: direction-specific timetable curve
# coefficients plus promotion-triggered early replan.
frequency:
  promotion:
    enable: true
    state_features: false
    window_min: 10.0
    cooldown_min: 10.0
    residual_threshold: 1.10
    persistence_ratio: 0.45
    adapt_low: false

upper:
  timetable_planner:
    basis_per_direction: 2
    shared_directions: false
    plan_all_directions: false
    action_ema_alpha: 0.35
    smooth_penalty: 0.04
    delta_min_s: -60.0
    delta_max_s: 20.0
    promotion_replan: true
    promotion_replan_strength_min: 0.35
