_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_termvalue20_hiro

# Phase-4 value-aware terminal relief. Convert delay to no-early-launch
# terminal holding only when causal fleet pressure is present and the current
# same-direction dispatch gap is shorter than the planned target headway.
upper:
  timetable_planner:
    terminal_value_relief:
      enable: true
      pressure_start: -2.0
      pressure_full: 0.5
      max_s: 15.0
      min_gap_deficit_s: 0.0
      gap_norm_s: 60.0
      gap_tolerance_s: 30.0
      gap_gain: 1.0
      demand_weight: 0.25
