_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_upperhist3_hiro

# Exp39-style combined repair: expose short upper decision history while
# restricting the upper residual action to a near-fixed alphabet.
upper:
  action_bins: [-5.0, 0.0, 5.0]
  state_history:
    enable: true
    length: 3
    action_norm_s: 20.0
    shift_norm_s: 45.0
    wait_norm_min: 10.0
    waiting_norm: 500.0
    plan_penalty_norm: 5.0
