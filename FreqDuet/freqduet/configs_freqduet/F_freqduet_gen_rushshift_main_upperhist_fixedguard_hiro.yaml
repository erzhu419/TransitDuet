_extends: F_freqduet_gen_rushshift_main_hiro.yaml
_name: F_freqduet_gen_rushshift_main_upperhist_fixedguard_hiro

# Observable-domain no-harm guard: rush-profile shifts use the exact
# fixed-headway expert; high-noise days remain learned because current main
# already beats fixed-headway there.
fixed_expert_selector:
  enable: true
  strict_headway_s: 360.0
  reset_env_rng: true
  start_ep: 0
  count_start: selector_start
  deterministic_rule:
    enable: true
    default: learned
    fixed_when:
      - min_cfg_peak_shift_abs: 0.05
