_extends: configs_freqduet/F_freqduet_terminal_final_rawhistory_hiro.yaml
_name: F_freqduet_terminal_sumorl_rawhist_holdrl_hiro

# SUMO-RL-style richer-state online holding baseline:
# single-level station holding RL, no LF/HF decomposition and no upper learning.
# Recent realized-demand history is exposed to the lower policy as local state,
# matching the "larger state + discretized holding action" online-control line.
coupling:
  upper_warmup_eps: 1000000

frequency:
  method: raw_history
  upper_features: true
  lower_features: true
  replace_upper_demand_with_low: true
  upper_history_bins: 6
  lower_history_bins: 6
  od_features: false
  drift_feedback:
    enable: false

reward_attribution:
  enable: false
