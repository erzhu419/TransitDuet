# Conservative Exp39-style repair: short upper decision history with the compression bin capped at -5s.
# Keeps current b15o22 terminal-bias/action-value guards; only changes the
# learned upper action alphabet and state history for a SUMO-RL exp39-style test.
upper:
  action_bins: [-5.0, 0.0, 5.0]
  state_history:
    enable: true
    length: 3
    action_norm_s: 20.0
    shift_norm_s: 45.0
    wait_norm_min: 10.0
    waiting_norm: 500.0
    plan_penalty_norm: 5.0
