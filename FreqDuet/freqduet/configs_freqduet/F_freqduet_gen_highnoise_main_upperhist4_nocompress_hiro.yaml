_name: F_freqduet_gen_highnoise_main_upperhist4_nocompress_hiro

# Overshoot-safe Exp39-style repair: short upper decision history with no compression bin.
# Keeps current b15o22 terminal-bias/action-value guards; only changes the
# learned upper action alphabet and state history for a SUMO-RL exp39-style test.
upper:
  action_bins: [0.0, 5.0, 10.0]
  state_history:
    enable: true
    length: 3
    action_norm_s: 20.0
    shift_norm_s: 45.0
    wait_norm_min: 10.0
    waiting_norm: 500.0
    plan_penalty_norm: 5.0
