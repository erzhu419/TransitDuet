_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_cfvalue_noisegate_hiro

# Counterfactual-value noise-gate selector.
# Use the exact fixed-headway expert outside the high-demand-noise regime.
fixed_expert_selector:
  enable: true
  strict_headway_s: 360.0
  reset_env_rng: true
  start_ep: 0
  count_start: selector_start
  deterministic_rule:
    enable: true
    default: fixed
