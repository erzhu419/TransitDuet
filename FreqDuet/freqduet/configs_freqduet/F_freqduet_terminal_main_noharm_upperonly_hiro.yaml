_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_noharm_upperonly_hiro

# Split diagnostic for the fleet no-harm repair: keep the lower holding policy
# unchanged and only project upper target-headway / timetable actions toward
# the fixed-headway executable baseline under fleet pressure.
fleet_noharm:
  upper:
    enable: true
    pressure_start: 0.0
    pressure_full: 2.0
    shrink_max: 1.0
    mode: all
    neutral_s: 0.0
  lower:
    enable: false

