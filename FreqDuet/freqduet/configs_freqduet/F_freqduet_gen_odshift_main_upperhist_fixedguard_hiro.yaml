_extends: F_freqduet_gen_odshift_main_hiro.yaml
_name: F_freqduet_gen_odshift_main_upperhist_fixedguard_hiro

# Observable-domain no-harm guard: keep learned control on nominal/high-noise
# days, but use the exact fixed-headway expert when OD perturbation is explicit.
fixed_expert_selector:
  enable: true
  strict_headway_s: 360.0
  reset_env_rng: true
  start_ep: 0
  count_start: selector_start
  deterministic_rule:
    enable: true
    default: learned
    fixed_when:
      - min_cfg_od_noise: 0.10
