_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_termvalselector_hiro

# Learned Phase-4 first-stop/terminal value selector. It chooses a small
# nonnegative terminal delay bias from causal local gap, demand, frequency, and
# fleet-pressure features. Unlike upper residual selectors, it does not compress
# target headways; it only decides whether first-stop delay is worth the
# wait-CV-fleet tradeoff.
upper:
  timetable_planner:
    terminal_value_selector:
      enable: true
      learn_start_ep: 20
      start_ep: 50
      min_observations: 512
      ridge: 0.75
      feature_clip: 8.0
      cost_clip: 8.0
      epsilon: 0.05
      improve_margin: 0.03
      delay_penalty: 0.05
      bias_norm_s: 5.0
      candidate_bias_s: [0.0, 5.0, 10.0, 15.0]
