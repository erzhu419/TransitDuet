_extends: F_freqduet_gen_rushshift_main_hiro.yaml
_name: F_freqduet_gen_rushshift_main_snapshotrushriskgate_tight7_hiro

# Tight soft gate: detect risk earlier, but leave a 7.5s positive-bias option
# to avoid the full zero-bias failure mode observed in rushshift.
upper:
  snapshot_value_selector:
    allowed_methods:
      - actor_term45_0
      - actor_target_p15
      - actor_term45_p15
    candidate_gate:
      enable: true
      default_max_positive_offset_s: 15.0
      risk_max_positive_offset_s: 7.5
      max_prev_headway_cv: 0.45
      max_prev_overshoot_norm: 0.20
      max_prev_terminal_shift_std_s: 10.0
