_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_fixedfallback_domainrisk_hiro

# Domain fallback plus a high-threshold historical risk escape hatch. Compared
# with fixedfallback_noharm, this avoids frequent terminal/OD fallback unless
# previous-day spacing risk is extreme.
fixed_expert_selector:
  enable: true
  strict_headway_s: 360.0
  reset_env_rng: true
  start_ep: 0
  count_start: selector_start
  deterministic_rule:
    enable: true
    default: learned
    fixed_when:
      - min_cfg_demand_noise: 0.25
      - min_cfg_peak_shift_abs: 0.05
      - min_prev_headway_cv: 0.500
      - min_prev_overshoot_norm: 0.180
      - min_prev_terminal_shift_norm: 0.450
