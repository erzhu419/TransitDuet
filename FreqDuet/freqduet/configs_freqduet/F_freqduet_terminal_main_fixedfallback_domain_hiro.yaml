_extends: F_freqduet_terminal_main_hiro.yaml
_name: F_freqduet_terminal_main_fixedfallback_domain_hiro

# Domain-prior fallback: keep learned FreqDuet on nominal/OD-shift days and
# use the exact fixed-headway expert only for high-noise or rush-profile shifts.
fixed_expert_selector:
  enable: true
  strict_headway_s: 360.0
  reset_env_rng: true
  start_ep: 0
  count_start: selector_start
  deterministic_rule:
    enable: true
    default: learned
    fixed_when:
      - min_cfg_demand_noise: 0.25
      - min_cfg_peak_shift_abs: 0.05
