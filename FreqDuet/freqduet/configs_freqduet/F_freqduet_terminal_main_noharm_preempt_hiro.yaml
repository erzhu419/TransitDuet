_extends: F_freqduet_terminal_main_noharm_hiro.yaml
_name: F_freqduet_terminal_main_noharm_preempt_hiro

# More conservative screen: start no-harm projection before the fleet budget is
# actually exceeded. The previous noharm candidate improved wait but did not
# reduce overshoot/CV enough against fixed-headway on terminal/rushshift.
fleet_noharm:
  upper:
    enable: true
    pressure_start: -1.0
    pressure_full: 1.0
    shrink_max: 1.0
    mode: all
    neutral_s: 0.0
  lower:
    enable: true
    pressure_start: -1.0
    pressure_full: 1.0
    shrink_max: 1.0
    min_action_s: 0.0
